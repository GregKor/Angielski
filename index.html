<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#14213d;--mute:#5b6b82;--acc:#1b2a49;--red:#d62839;--ok:#1f8a5b;--bad:#c0392b;--line:#d9dee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

main{max-width:560px;margin:0 auto;padding:16px 14px 40px}h1{font-size:1.7rem;margin:0 0 12px;letter-spacing:-.02em}h1 b{color:var(--red)}

.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.row>*{flex:1}

.b.p{background:var(--red);border-color:var(--red);color:#fff}.b.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}.b.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}

</style></head><body><main>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px"><h1 style="margin:0">My English <small style="font-size:.9rem;color:var(--red)">wersja II</small></h1><button class="b" id="th" onclick="thm()" aria-label="Zmień motyw" style="flex:none;padding:8px 12px"></button></div>
<nav id="nav"></nav><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={srs:{},err:{},days:{},ai:{p:'gemini',key:'',model:'',base:''},cat:-1};
try{Object.assign(S,JSON.parse(localStorage.getItem('eng-b2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('eng-b2',JSON.stringify(S))}catch(e){}};
const day=(o=0)=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const C=['Praca i nauka','Podróże','Codzienność','Opinie i uczucia'];
const W=`0|achieve|osiągnąć|0|deadline|termin|0|colleague|współpracownik|0|improve|poprawić|0|manage|zarządzać|0|require|wymagać|0|responsible|odpowiedzialny|0|skill|umiejętność|0|salary|pensja|0|apply for|ubiegać się o|0|reliable|niezawodny|0|schedule|harmonogram|1|journey|podróż|1|luggage|bagaż|1|delay|opóźnienie|1|book|zarezerwować|1|abroad|za granicą|1|accommodation|zakwaterowanie|1|border|granica|1|crowded|zatłoczony|1|sightseeing|zwiedzanie|1|souvenir|pamiątka|1|passport|paszport|2|neighbour|sąsiad|2|rent|czynsz / wynajmować|2|chore|obowiązek domowy|2|bill|rachunek|2|afford|pozwolić sobie na|2|household|gospodarstwo domowe|2|repair|naprawiać|2|habit|nawyk|2|environment|środowisko|2|recipe|przepis|3|annoyed|zirytowany|3|trust|ufać|3|argue|kłócić się|3|suggest|sugerować|3|disappointed|rozczarowany|3|reasonable|rozsądny|3|disagree|nie zgadzać się|3|struggle|zmagać się|3|proud|dumny|3|regret|żałować|3|fair|sprawiedliwy|3|likely|prawdopodobny`.split('|');
const WL=[];for(let i=0;i<W.length;i+=3)WL.push({c:+W[i],e:W[i+1],p:W[i+2]});
const IR=`be|was/were|been|być;begin|began|begun|zaczynać;break|broke|broken|łamać;bring|brought|brought|przynieść;build|built|built|budować;buy|bought|bought|kupić;choose|chose|chosen|wybrać;come|came|come|przyjść;do|did|done|robić;drive|drove|driven|jechać;eat|ate|eaten|jeść;fall|fell|fallen|upaść;feel|felt|felt|czuć;find|found|found|znaleźć;forget|forgot|forgotten|zapomnieć;get|got|got|dostać;give|gave|given|dać;go|went|gone|iść;have|had|had|mieć;keep|kept|kept|trzymać;know|knew|known|wiedzieć;leave|left|left|wyjść;lose|lost|lost|zgubić;make|made|made|zrobić;meet|met|met|spotkać;pay|paid|paid|płacić;run|ran|run|biegać;say|said|said|powiedzieć;see|saw|seen|widzieć;speak|spoke|spoken|mówić;take|took|taken|brać;write|wrote|written|pisać`.split(';').map(x=>x.split('|'));
const TEN=[['Present Simple','V / V-s','I work every day.','nawyki, fakty'],['Present Continuous','am/is/are + V-ing','I am working now.','dzieje się teraz'],['Past Simple','V-ed / 2. forma','I worked yesterday.','zakończona czynność w przeszłości'],['Past Continuous','was/were + V-ing','I was working at 5.','trwała w momencie w przeszłości'],['Present Perfect','have/has + 3. forma','I have worked here for 3 years.','związek przeszłości z teraźniejszością'],['Past Perfect','had + 3. forma','I had worked before he came.','wcześniej niż inna czynność w przeszłości'],['Future (will / going to)','will + V / am going to + V','I will call you. I am going to study.','decyzja spontaniczna / plan']];
const GR=[['Conditionals (0–3)','0: If you heat ice, it melts.\n1: If it rains, I will stay home.\n2: If I had money, I would travel.\n3: If I had known, I would have come.'],['Passive voice','be + 3. forma: The report was written by Tom. English is spoken here.'],['Reported speech','Cofamy czas: "I am tired" → She said (that) she was tired.'],['Modal verbs','must (musieć), should (powinien), might (może), can\'t (niemożliwe): He can\'t be at home, his car isn\'t here.'],['Relative clauses','who (osoby), which (rzeczy), whose (czyj): The man whose car was stolen called the police.'],['Gerund vs infinitive','enjoy/avoid/suggest + V-ing; want/decide/hope + to V; stop doing ≠ stop to do.'],['Wish / If only','I wish I knew. (teraz) I wish I had studied. (przeszłość)']];
const TABS=[['hm','Dziś'],['nk','Nauka'],['fi','Fiszki'],['tx','Tekst'],['qz','Quiz'],['gr','Gramat.'],['cz','Czasy'],['ai','AI'],['er','Błędy']];
let tab='hm',cur=null,flip=false,qz=null,qs=[0,0],ir=null,chat=[];
const pool=()=>WL.filter(w=>S.cat<0||w.c==S.cat);
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const mst=()=>Object.values(S.srs).filter(x=>x[0]>=4).length;const bump=()=>{S.days[day()]=(S.days[day()]||0)+1;S.hist=S.hist||{};S.hist[day()]=mst();save()};
function pick(){const d=day(),p=pool(),due=p.filter(w=>!S.srs[w.e]||S.srs[w.e][1]<=d);const q=due.length?due:p,q2=q.filter(w=>w!==cur);return rnd(q2.length?q2:q)}
function grade(ok){const w=cur,b=S.srs[w.e]?S.srs[w.e][0]:0,nb=ok?Math.min(b+1,4):0,iv=[0,1,3,7,14][nb];S.srs[w.e]=[nb,day(-iv)];
if(ok)delete S.err[w.e];else S.err[w.e]=1;bump();cur=pick();flip=false;go()}
function streak(){let n=0,o=S.days[day()]?0:1;while(S.days[day(o+n)])n++;return n}
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t[0]==tab}" onclick="tab='${t[0]}';go()">${t[1]}</button>`).join('')}
function go(){nav();const f={hm,nk,fi,tx,qz:qzv,gr,cz,ai,er}[tab];$('#v').innerHTML=(nt?`<div class="card" style="border-color:var(--red)">⚠️ ${esc(nt)}</div>`:'')+f();nt=''}
function hm(){const wk=[6,5,4,3,2,1,0].map(o=>`<div class="wd ${S.days[day(o)]?'on':''}">${['N','Pn','Wt','Śr','Cz','Pt','So'][new Date(Date.now()-o*864e5).getDay()]}<br>${S.days[day(o)]||'·'}</div>`).join('');
return`<div class="card"><div class="mute">Seria dni</div><div class="big">🔥 ${streak()}</div><div class="mute">Dziś: ${S.days[day()]||0} odpowiedzi · Opanowane: ${Object.values(S.srs).filter(x=>x[0]>=4).length}/${WL.length}</div></div><div class="wk">${wk}</div>${chart()}<button class="b p" style="width:100%;margin-top:14px;padding:16px" onclick="tab='fi';go()">Zacznij powtórkę</button>`+bkp()}
function setc(i){S.cat=i;save();cur=null;qz=null;go()}
function nq(){const w=pick(),p=pool().length>=4?pool():WL,o=new Set([w.p]);while(o.size<4)o.add(rnd(p).p);qz={w,o:[...o].sort(()=>Math.random()-.5),a:null};if(S.qsay!==0)setTimeout(()=>say(w.e),200)}
function qzv(){if(!qz)nq();const q=qz;return`<div class="mute">Wynik: ${qs[0]}/${qs[1]}</div><div class="card"><div class="big">${esc(q.w.e)}</div><div class="row"><button class="b" onclick="say(qz.w.e)">🔊 Posłuchaj</button><button class="b ${S.qsay!==0?'p':''}" onclick="S.qsay=S.qsay===0?1:0;save();go()">Auto dźwięk: ${S.qsay!==0?'wł.':'wył.'}</button></div></div>`+q.o.map((o,i)=>`<button class="b ${q.a==null?'':o==q.w.p?'ok':i==q.a?'no':''}" style="width:100%;margin-bottom:8px" onclick="ans(${i})">${esc(o)}</button>`).join('')+(q.a!=null?`<button class="b p" style="width:100%" onclick="nq();go()">Dalej</button>`:'')}
function ans(i){if(qz.a!=null)return;qz.a=i;const ok=qz.o[i]==qz.w.p;qs[1]++;if(ok)qs[0]++;else S.err[qz.w.e]=1;bump();go()}
function gr(){return GR.map(g=>`<details><summary>${g[0]}</summary><p style="white-space:pre-wrap">${esc(g[1])}</p></details>`).join('')}
function cz(){const t=`<table><tr><th>Czas</th><th>Budowa</th><th>Użycie</th></tr>${TEN.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[3]}<br><i>${t[2]}</i></td></tr>`).join('')}</table>`;
if(!ir)ir=rnd(IR);return`<details open><summary>Czasy – ściąga</summary>${t}</details><div class="card"><div class="mute">Czasowniki nieregularne: ${esc(ir[3])}</div><div class="big">${ir[0]}</div><input id="i2" placeholder="Past Simple" autocapitalize="off"><input id="i3" placeholder="Past Participle" autocapitalize="off"><div class="row"><button class="b p" onclick="chk()">Sprawdź</button></div><div id="ir" class="mute"></div></div><details><summary>Lista (${IR.length})</summary><table>${IR.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></details>`}
function chk(){const a=$('#i2').value.trim().toLowerCase(),b=$('#i3').value.trim().toLowerCase(),ok=a==ir[1].toLowerCase()&&b==ir[2];bump();$('#ir').innerHTML=ok?'✅ Dobrze!':`❌ ${ir[0]} – ${ir[1]} – ${ir[2]}`;setTimeout(()=>{ir=rnd(IR);go()},ok?600:2200)}
function er(){const k=Object.keys(S.err);return k.length?`<p class="mute">Słówka, w których się pomyliłeś (${k.length}):</p>`+k.map(e=>{const w=WL.find(x=>x.e==e);return`<div class="card" style="padding:10px;text-align:left"><b>${esc(e)}</b> – ${esc(w?w.p:'')} <button class="b" onclick="say('${esc(e)}')">🔊</button> <button class="b" onclick="delete S.err['${esc(e)}'];save();go()">✕</button></div>`}).join(''):'<div class="card">Brak błędów. 🎉</div>'}
let nt='',sel=null,txm=false,busy='',ntn='',ntw='',trv='';
const note=t=>{nt=t;go()};S.ai2=S.ai2||{p:'groq',key:'',model:'',base:''};S.custom=S.custom||[];S.mem=S.mem||{};S.txt=S.txt||'';
function reg(n,arr){let i=C.indexOf(n);if(i<0){i=C.length;C.push(n)}arr.forEach(([e,p])=>{if(!WL.some(w=>w.c==i&&w.e.toLowerCase()==e.toLowerCase()))WL.push({c:i,e,p})})}
function addTopic(n,arr){reg(n,arr);let t=S.custom.find(x=>x.n==n);if(!t)S.custom.push(t={n,w:[]});arr.forEach(a=>{if(!t.w.some(x=>x[0].toLowerCase()==a[0].toLowerCase()))t.w.push(a)});save()}
S.custom.forEach(t=>reg(t.n,t.w));
const aj=t=>JSON.parse(String(t).replace(/```json|```/g,'').trim().match(/[\[{][\s\S]*[\]}]/)[0]);
async function aic(sys,msgs){const A=[S.ai,S.ai2].filter(x=>x&&x.key);if(!A.length)return aic1(S.ai,sys,msgs);const er=[];for(let i=0;i<A.length;i++){try{return await aic1(A[i],sys,msgs)}catch(e){er.push('AI '+(A[i]===S.ai?1:2)+': '+e.message)}}throw new Error(er.join(' | '))}
async function aic1(a,sys,msgs,mm){if(!a.key)throw new Error('Najpierw wklej klucz API w zakładce AI.');let url,o;
if(a.p=='gemini'){url=`https://generativelanguage.googleapis.com/v1beta/models/${mm||a.model||'gemini-3.5-flash'}:generateContent`;o={method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':a.key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:msgs.map(m=>({role:m.role=='assistant'?'model':'user',parts:[{text:m.content}]}))})}}
else{const b=a.p=='groq'?'https://api.groq.com/openai/v1':a.base.replace(/\/+$/,'');url=b+'/chat/completions';o={method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.key},body:JSON.stringify({model:a.model||'llama-3.3-70b-versatile',messages:[{role:'system',content:sys},...msgs]})}}
let r;try{r=await fetch(url,o)}catch(e){throw new Error('Nie można połączyć się z AI. Na stronie testowej połączenia zewnętrzne są blokowane – AI działa po wgraniu plików na własny hosting.')}if(r.status==404&&a.p=='gemini'&&!a.model&&!mm)return aic1(a,sys,msgs,'gemini-3.1-flash-lite');if(!r.ok)throw new Error(r.status==404?'Błąd 404: model nie istnieje. Wpisz w polu Model aktualną nazwę, np. gemini-3.5-flash.':r.status==429?'Błąd 429: przekroczony limit zapytań. Poczekaj chwilę i spróbuj ponownie.':'Błąd API '+r.status+'. Sprawdź klucz i model.');const d=await r.json();
return a.p=='gemini'?d.candidates[0].content.parts.map(p=>p.text||'').join(''):d.choices[0].message.content}
function nk(){const P=['Biznes','Zdrowie','Technologia','Prawo','Podróże lotnicze','Emocje','Jedzenie','Sport'];
return`${busy?`<div class="card">${esc(busy)}</div>`:''}<p class="mute">Wybierz temat – fiszki i quiz pokażą tylko jego słówka.</p><div class="row" style="flex-direction:column"><button class="b ${S.cat<0?'p':''}" onclick="setc(-1)">Wszystkie (${WL.length})</button>${C.map((c,i)=>`<button class="b ${S.cat==i?'p':''}" onclick="setc(${i})">${esc(c)} (${WL.filter(w=>w.c==i).length})</button>`).join('')}</div>
<h3>🤖 Tematy z AI</h3><p class="mute">Dotknij, a AI przygotuje ok. 15 słówek B1–B2.</p>${P.map(p=>`<button class="chip" onclick="genTopic('${p}')">${p}</button>`).join('')}
<h3>📦 Pakiet B1–B2 (ok. 2000 sówek)</h3><p class="mute">AI przygotuje ${PK.length} tematów po ok. 50 sówek. Trwa kilka minut (nie zamykaj aplikacji). Można przerwać, a kolejne uruchomienie kontynuuje. Gotowe: ${(S.pack||[]).length}/${PK.length}.</p><div class="row"><button class="b p" onclick="pack()">${pk?'Trwa…':'Generuj pakiet'}</button><button class="b" onclick="stopPack()">Stop</button></div><h3>✏️ Własny temat</h3><input placeholder="Nazwa tematu" value="${esc(ntn)}" oninput="ntn=this.value"><textarea rows="5" placeholder="Słówka, po jednym w linii: word - tłumaczenie (tłumaczenie opcjonalne, uzupełni AI)" oninput="ntw=this.value">${esc(ntw)}</textarea><div class="row"><button class="b p" onclick="own()">Dodaj moje słówka</button><button class="b" onclick="genTopic(ntn)">Generuj z AI</button></div>`}
async function genTopic(n){n=(n||'').trim();if(!n)return note('Wpisz nazwę tematu.');busy='Generuję słówka: '+n+'…';go();try{const t=await aic('You are an English teacher. Return ONLY a JSON array of 15 useful B1-B2 English words or phrases for the given topic, as [english, polish] pairs.',[{role:'user',content:n}]);addTopic(n,aj(t).filter(x=>x[0]&&x[1]));S.cat=C.indexOf(n);cur=null;save()}catch(e){nt=e.message}busy='';go()}
async function own(){const n=ntn.trim();if(!n||!ntw.trim())return note('Podaj nazwę i słówka.');busy='Dodaję…';go();try{const ok=[],miss=[];ntw.split('\n').forEach(l=>{l=l.trim();if(!l)return;const p=l.split(/\s+[-–=:]\s+|\t/);p[1]?ok.push([p[0].trim(),p[1].trim()]):miss.push(l)});
if(miss.length)ok.push(...aj(await aic('Translate each English word/phrase to Polish. Return ONLY a JSON array of [english, polish] pairs.',[{role:'user',content:miss.join('\n')}])));addTopic(n,ok);S.cat=C.indexOf(n);cur=null;ntw=''}catch(e){nt=e.message}busy='';go()}

function addw(){const p=($('#sp').value||'').trim();if(!p)return note('Wpisz tłumaczenie lub użyj AI.');addTopic('Moje słówka',[[sel.toLowerCase(),p]]);sel=null;trv='';go()}
const TUT='You are a friendly English conversation tutor for a Polish learner at B1-B2 level. Chat naturally in English, keep replies short and always end with a question to continue the talk. If the user makes mistakes, add a short line "✏️ Poprawka:" with the corrected sentence and a one-sentence explanation in Polish. Explain hard words in Polish in brackets.';
function ai(){const a=S.ai;return`<details ${(aiop==null?!a.key:aiop)?'open':''} ontoggle="aiop=this.open"><summary>Ustawienia AI</summary><select onchange="S.ai.p=this.value;save();go()"><option value="gemini" ${a.p=='gemini'?'selected':''}>Gemini</option><option value="groq" ${a.p=='groq'?'selected':''}>Groq</option><option value="custom" ${a.p=='custom'?'selected':''}>Własny (zgodny z OpenAI)</option></select><input type="password" placeholder="Klucz API" value="${esc(a.key)}" onchange="S.ai.key=this.value.trim();save()"><input placeholder="Model (domyślnie ${a.p=='gemini'?'gemini-3.5-flash':'llama-3.3-70b-versatile'})" value="${esc(a.model)}" onchange="S.ai.model=this.value.trim();save()">${a.p=='custom'?`<input placeholder="Adres API, np. https://…/v1" value="${esc(a.base)}" onchange="S.ai.base=this.value.trim();save()">`:''}${a.p=='custom'?'':`<p><a href="${a.p=='gemini'?'https://aistudio.google.com/apikey':'https://console.groq.com/keys'}" target="_blank" rel="noopener">🔑 Pobierz darmowy klucz API (${a.p=='gemini'?'Google AI Studio':'Groq'})</a></p>`}${cfg2()}<div class="row"><button class="b" onclick="testAI()">🔌 Testuj połączenie</button></div><div class="mute" style="white-space:pre-wrap">${esc(tres)}</div><p class="mute">Klucz zostaje tylko w tej przeglądarce.</p></details><p class="mute">👩‍🏫 Rozmawiaj z korepetytorem po angielsku – poprawi Twoje błędy.</p><div>${chat.map((m,i)=>`<div class="msg ${m.role=='user'?'me':''}">${esc(m.content)}${m.role=='user'?'':` <button class="b" onclick="say(chat[${i}].content)">🔊</button>`}</div>`).join('')}${busy=='ai'?'<div class="msg">…</div>':''}</div><textarea id="at" rows="3" placeholder="Napisz lub nagraj wiadomość po angielsku…"></textarea><div class="row"><button class="b" onclick="mic()">🎤</button><button class="b p" onclick="ask()">Wyślij</button><button class="b" onclick="chat=[];go()">Wyczyść</button></div>`}
let tres='';async function testAI(){aiop=true;tres='Testuję…';go();const o=[];for(const [n,c] of [['AI 1',S.ai],['AI 2',S.ai2]]){if(n=='AI 2'&&!c.key)continue;try{await aic1(c,'Reply with the single word OK.',[{role:'user',content:'ping'}]);o.push('✅ '+n+': działa')}catch(e){o.push('❌ '+n+': '+e.message)}}tres=o.join('\n');go()}
let aiop=null;
function cfg2(){const a=S.ai2;return`<h3 style="font-size:1rem">AI 2 – zapasowe</h3><p class="mute">Użyte automatycznie, gdy AI 1 przekroczy limit lub zawiedzie. Możesz zostawić puste.</p><select onchange="S.ai2.p=this.value;save();go()"><option value="gemini" ${a.p=='gemini'?'selected':''}>Gemini</option><option value="groq" ${a.p=='groq'?'selected':''}>Groq</option><option value="custom" ${a.p=='custom'?'selected':''}>Własny (zgodny z OpenAI)</option></select><input type="password" placeholder="Klucz API (AI 2)" value="${esc(a.key)}" onchange="S.ai2.key=this.value.trim();save()"><input placeholder="Model (puste = domyślny)" value="${esc(a.model)}" onchange="S.ai2.model=this.value.trim();save()">${a.p=='custom'?`<input placeholder="Adres API, np. https://…/v1" value="${esc(a.base)}" onchange="S.ai2.base=this.value.trim();save()">`:`<p><a href="${a.p=='gemini'?'https://aistudio.google.com/apikey':'https://console.groq.com/keys'}" target="_blank" rel="noopener">🔑 Pobierz klucz API</a></p>`}`}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return note('Ta przeglądarka nie obsługuje rozpoznawania mowy.');const r=new R();r.lang='en-US';r.onresult=e=>{$('#at').value=e.results[0][0].transcript};r.start()}
async function ask(){const t=$('#at').value.trim();if(!t)return;chat.push({role:'user',content:t});busy='ai';go();try{chat.push({role:'assistant',content:await aic(TUT,chat)})}catch(e){chat.push({role:'assistant',content:'Błąd: '+e.message})}busy='';go()}
go();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
