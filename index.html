<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2a49"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="English B2"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><title>My English B2</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#14213d;--mute:#5b6b82;--acc:#1b2a49;--red:#d62839;--ok:#1f8a5b;--bad:#c0392b;--line:#d9dee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#18213a;--ink:#eaf0f8;--mute:#9db0c9;--acc:#8fb0f0;--red:#f06070;--ok:#4cc38a;--bad:#ef7b6e;--line:#2a3555}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}h1{font-size:1.7rem;margin:0 0 12px;letter-spacing:-.02em}h1 b{color:var(--red)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mute);font:600 13px inherit;font-family:inherit;padding:10px 8px;border-radius:10px;cursor:pointer}
nav button[aria-selected=true]{background:var(--red);color:#fff}
button{font-family:inherit}button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;margin-bottom:12px}
.big{font-size:1.9rem;font-weight:800}.mute{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.row>*{flex:1}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.b.p{background:var(--red);border-color:var(--red);color:#fff}.b.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}.b.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.chip{display:inline-block;background:color-mix(in srgb,var(--red) 14%,var(--card));border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.9rem;margin:2px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}summary{font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
.panel{display:none}.panel.on{display:block}.msg{white-space:pre-wrap;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.msg.me{background:color-mix(in srgb,var(--red) 10%,var(--card))}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;font-size:.75rem}.wd.on{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok)}
</style></head><body><main>
<h1>My English <b>B2</b></h1>
<nav id="nav"></nav><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={srs:{},err:{},days:{},ai:{p:'gemini',key:'',model:'',base:''},cat:-1};
try{Object.assign(S,JSON.parse(localStorage.getItem('eng-b2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('eng-b2',JSON.stringify(S))}catch(e){}};
const day=(o=0)=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const C=['Praca i nauka','Podróże','Codzienność','Opinie i uczucia'];
const W=`0|achieve|osiągnąć|0|deadline|termin|0|colleague|współpracownik|0|improve|poprawić|0|manage|zarządzać|0|require|wymagać|0|responsible|odpowiedzialny|0|skill|umiejętność|0|salary|pensja|0|apply for|ubiegać się o|0|reliable|niezawodny|0|schedule|harmonogram|1|journey|podróż|1|luggage|bagaż|1|delay|opóźnienie|1|book|zarezerwować|1|abroad|za granicą|1|accommodation|zakwaterowanie|1|border|granica|1|crowded|zatłoczony|1|sightseeing|zwiedzanie|1|souvenir|pamiątka|1|passport|paszport|2|neighbour|sąsiad|2|rent|czynsz / wynajmować|2|chore|obowiązek domowy|2|bill|rachunek|2|afford|pozwolić sobie na|2|household|gospodarstwo domowe|2|repair|naprawiać|2|habit|nawyk|2|environment|środowisko|2|recipe|przepis|3|annoyed|zirytowany|3|trust|ufać|3|argue|kłócić się|3|suggest|sugerować|3|disappointed|rozczarowany|3|reasonable|rozsądny|3|disagree|nie zgadzać się|3|struggle|zmagać się|3|proud|dumny|3|regret|żałować|3|fair|sprawiedliwy|3|likely|prawdopodobny`.split('|');
const WL=[];for(let i=0;i<W.length;i+=3)WL.push({c:+W[i],e:W[i+1],p:W[i+2]});
const IR=`be|was/were|been|być;begin|began|begun|zaczynać;break|broke|broken|łamać;bring|brought|brought|przynieść;build|built|built|budować;buy|bought|bought|kupić;choose|chose|chosen|wybrać;come|came|come|przyjść;do|did|done|robić;drive|drove|driven|jechać;eat|ate|eaten|jeść;fall|fell|fallen|upaść;feel|felt|felt|czuć;find|found|found|znaleźć;forget|forgot|forgotten|zapomnieć;get|got|got|dostać;give|gave|given|dać;go|went|gone|iść;have|had|had|mieć;keep|kept|kept|trzymać;know|knew|known|wiedzieć;leave|left|left|wyjść;lose|lost|lost|zgubić;make|made|made|zrobić;meet|met|met|spotkać;pay|paid|paid|płacić;run|ran|run|biegać;say|said|said|powiedzieć;see|saw|seen|widzieć;speak|spoke|spoken|mówić;take|took|taken|brać;write|wrote|written|pisać`.split(';').map(x=>x.split('|'));
const TEN=[['Present Simple','V / V-s','I work every day.','nawyki, fakty'],['Present Continuous','am/is/are + V-ing','I am working now.','dzieje się teraz'],['Past Simple','V-ed / 2. forma','I worked yesterday.','zakończona czynność w przeszłości'],['Past Continuous','was/were + V-ing','I was working at 5.','trwała w momencie w przeszłości'],['Present Perfect','have/has + 3. forma','I have worked here for 3 years.','związek przeszłości z teraźniejszością'],['Past Perfect','had + 3. forma','I had worked before he came.','wcześniej niż inna czynność w przeszłości'],['Future (will / going to)','will + V / am going to + V','I will call you. I am going to study.','decyzja spontaniczna / plan']];
const GR=[['Conditionals (0–3)','0: If you heat ice, it melts.\n1: If it rains, I will stay home.\n2: If I had money, I would travel.\n3: If I had known, I would have come.'],['Passive voice','be + 3. forma: The report was written by Tom. English is spoken here.'],['Reported speech','Cofamy czas: "I am tired" → She said (that) she was tired.'],['Modal verbs','must (musieć), should (powinien), might (może), can\'t (niemożliwe): He can\'t be at home, his car isn\'t here.'],['Relative clauses','who (osoby), which (rzeczy), whose (czyj): The man whose car was stolen called the police.'],['Gerund vs infinitive','enjoy/avoid/suggest + V-ing; want/decide/hope + to V; stop doing ≠ stop to do.'],['Wish / If only','I wish I knew. (teraz) I wish I had studied. (przeszłość)']];
const TABS=[['hm','Dziś'],['nk','Nauka'],['fi','Fiszki'],['qz','Quiz'],['gr','Gramat.'],['cz','Czasy'],['ai','AI'],['er','Błędy']];
let tab='hm',cur=null,flip=false,qz=null,qs=[0,0],ir=null,chat=[];
const pool=()=>WL.filter(w=>S.cat<0||w.c==S.cat);
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const bump=()=>{S.days[day()]=(S.days[day()]||0)+1;save()};
function pick(){const d=day(),p=pool(),due=p.filter(w=>!S.srs[w.e]||S.srs[w.e][1]<=d);return rnd(due.length?due:p)}
function grade(ok){const w=cur,b=S.srs[w.e]?S.srs[w.e][0]:0,nb=ok?Math.min(b+1,4):0,iv=[0,1,3,7,14][nb];S.srs[w.e]=[nb,day(-iv)];
if(ok)delete S.err[w.e];else S.err[w.e]=1;bump();cur=pick();flip=false;go()}
function streak(){let n=0,o=S.days[day()]?0:1;while(S.days[day(o+n)])n++;return n}
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t[0]==tab}" onclick="tab='${t[0]}';go()">${t[1]}</button>`).join('')}
function go(){nav();const f={hm,nk,fi,qz:qzv,gr,cz,ai,er}[tab];$('#v').innerHTML=f()}
function hm(){const wk=[6,5,4,3,2,1,0].map(o=>`<div class="wd ${S.days[day(o)]?'on':''}">${['N','Pn','Wt','Śr','Cz','Pt','So'][new Date(Date.now()-o*864e5).getDay()]}<br>${S.days[day(o)]||'·'}</div>`).join('');
return`<div class="card"><div class="mute">Seria dni</div><div class="big">🔥 ${streak()}</div><div class="mute">Dziś: ${S.days[day()]||0} odpowiedzi · Opanowane: ${Object.values(S.srs).filter(x=>x[0]>=4).length}/${WL.length}</div></div><div class="wk">${wk}</div><button class="b p" style="width:100%;margin-top:14px;padding:16px" onclick="tab='fi';go()">Zacznij powtórkę</button>`}
function nk(){return`<p class="mute">Wybierz temat – fiszki i quiz pokażą tylko jego słówka.</p><div class="row" style="flex-direction:column"><button class="b ${S.cat<0?'p':''}" onclick="setc(-1)">Wszystkie (${WL.length})</button>${C.map((c,i)=>`<button class="b ${S.cat==i?'p':''}" onclick="setc(${i})">${c} (${WL.filter(w=>w.c==i).length})</button>`).join('')}</div>`}
function setc(i){S.cat=i;save();cur=null;qz=null;go()}
function fi(){if(!cur)cur=pick();const s=S.srs[cur.e];return`<div class="card" onclick="flip=!flip;go()" style="min-height:200px;cursor:pointer"><div class="mute">${C[cur.c]} · poziom ${s?s[0]:0}/4</div><div class="big">${flip?esc(cur.p):esc(cur.e)}</div><div class="mute">${flip?'':'Dotknij, aby odwrócić'}</div></div><div class="row"><button class="b" onclick="say(cur.e)">🔊 Posłuchaj</button></div><div class="row"><button class="b no" onclick="grade(false)">Nie znam</button><button class="b ok" onclick="grade(true)">Znam</button></div>`}
function nq(){const w=pick(),p=pool().length>=4?pool():WL,o=new Set([w.p]);while(o.size<4)o.add(rnd(p).p);qz={w,o:[...o].sort(()=>Math.random()-.5),a:null}}
function qzv(){if(!qz)nq();const q=qz;return`<div class="mute">Wynik: ${qs[0]}/${qs[1]}</div><div class="card"><div class="big">${esc(q.w.e)}</div></div>`+q.o.map((o,i)=>`<button class="b ${q.a==null?'':o==q.w.p?'ok':i==q.a?'no':''}" style="width:100%;margin-bottom:8px" onclick="ans(${i})">${esc(o)}</button>`).join('')+(q.a!=null?`<button class="b p" style="width:100%" onclick="nq();go()">Dalej</button>`:'')}
function ans(i){if(qz.a!=null)return;qz.a=i;const ok=qz.o[i]==qz.w.p;qs[1]++;if(ok)qs[0]++;else S.err[qz.w.e]=1;bump();go()}
function gr(){return GR.map(g=>`<details><summary>${g[0]}</summary><p style="white-space:pre-wrap">${esc(g[1])}</p></details>`).join('')}
function cz(){const t=`<table><tr><th>Czas</th><th>Budowa</th><th>Użycie</th></tr>${TEN.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td>${t[3]}<br><i>${t[2]}</i></td></tr>`).join('')}</table>`;
if(!ir)ir=rnd(IR);return`<details open><summary>Czasy – ściąga</summary>${t}</details><div class="card"><div class="mute">Czasowniki nieregularne: ${esc(ir[3])}</div><div class="big">${ir[0]}</div><input id="i2" placeholder="Past Simple" autocapitalize="off"><input id="i3" placeholder="Past Participle" autocapitalize="off"><div class="row"><button class="b p" onclick="chk()">Sprawdź</button></div><div id="ir" class="mute"></div></div><details><summary>Lista (${IR.length})</summary><table>${IR.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></details>`}
function chk(){const a=$('#i2').value.trim().toLowerCase(),b=$('#i3').value.trim().toLowerCase(),ok=a==ir[1].toLowerCase()&&b==ir[2];bump();$('#ir').innerHTML=ok?'✅ Dobrze!':`❌ ${ir[0]} – ${ir[1]} – ${ir[2]}`;setTimeout(()=>{ir=rnd(IR);go()},ok?600:2200)}
function er(){const k=Object.keys(S.err);return k.length?`<p class="mute">Słówka, w których się pomyliłeś (${k.length}):</p>`+k.map(e=>{const w=WL.find(x=>x.e==e);return`<div class="card" style="padding:10px;text-align:left"><b>${esc(e)}</b> – ${esc(w?w.p:'')} <button class="b" onclick="say('${esc(e)}')">🔊</button> <button class="b" onclick="delete S.err['${esc(e)}'];save();go()">✕</button></div>`}).join(''):'<div class="card">Brak błędów. 🎉</div>'}
function ai(){const a=S.ai;return`<details ${a.key?'':'open'}><summary>Ustawienia AI</summary><select id="ap" onchange="S.ai.p=this.value;save();go()"><option value="gemini" ${a.p=='gemini'?'selected':''}>Gemini</option><option value="groq" ${a.p=='groq'?'selected':''}>Groq</option><option value="custom" ${a.p=='custom'?'selected':''}>Własny (zgodny z OpenAI)</option></select><input id="ak" type="password" placeholder="Klucz API" value="${esc(a.key)}" onchange="S.ai.key=this.value.trim();save()"><input placeholder="Model (domyślnie ${a.p=='gemini'?'gemini-2.0-flash':'llama-3.3-70b-versatile'})" value="${esc(a.model)}" onchange="S.ai.model=this.value.trim();save()">${a.p=='custom'?`<input placeholder="Adres API, np. https://…/v1" value="${esc(a.base)}" onchange="S.ai.base=this.value.trim();save()">`:''}<p class="mute">Klucz zostaje tylko w tej przeglądarce.</p></details><div id="ch">${chat.map(m=>`<div class="msg ${m.role=='user'?'me':''}">${esc(m.content)}</div>`).join('')}</div><textarea id="at" rows="3" placeholder="Napisz zdanie po angielsku – poprawię je i wyjaśnię po polsku, albo porozmawiaj ze mną."></textarea><div class="row"><button class="b p" onclick="ask()">Wyślij</button><button class="b" onclick="chat=[];go()">Wyczyść</button></div>`}
async function ask(){const t=$('#at').value.trim(),a=S.ai;if(!t)return;if(!a.key){alert('Wklej klucz API w ustawieniach.');return}chat.push({role:'user',content:t});go();
const sys='You are a friendly English tutor for a Polish learner at B1-B2 level. If the user writes an English sentence, correct it, show the corrected version and explain mistakes briefly in Polish. If they chat, reply in simple English and add Polish hints for hard words. Be concise.';
try{let url,o;if(a.p=='gemini'){const m=a.model||'gemini-2.0-flash';url=`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`;o={method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':a.key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:chat.map(m=>({role:m.role=='user'?'user':'model',parts:[{text:m.content}]}))})}}
else{const b=a.p=='groq'?'https://api.groq.com/openai/v1':a.base.replace(/\/+$/,'');url=b+'/chat/completions';o={method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.key},body:JSON.stringify({model:a.model||'llama-3.3-70b-versatile',messages:[{role:'system',content:sys},...chat]})}}
const r=await fetch(url,o);if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const x=a.p=='gemini'?d.candidates[0].content.parts.map(p=>p.text||'').join(''):d.choices[0].message.content;chat.push({role:'assistant',content:x})}
catch(e){chat.push({role:'assistant',content:'Błąd: '+e.message+'. Sprawdź klucz, model i adres w ustawieniach.'})}go()}
go();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
